name: Build Modded TWRP (pipa) with WOA Flasher

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      TWRP_BRANCH:
        description: 'TWRP Branch Version'
        required: true
        default: 'android-12.1'
        type: choice
        options:
        - android-12.1
        - android-11.0
      DEVICE_TREE:
        description: 'TWRP Device Tree URL'
        required: true
        default: 'https://github.com/PipaDB/OFRP-device_xiaomi_pipa'
      DEVICE_TREE_BRANCH:
        description: 'TWRP Device Tree Branch'
        required: true
        default: 'fox_12.1-a16'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/xiaomi/pipa'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'pipa'
      BUILD_TARGET:
        description: 'Specify your Build Target (pipa uses boot)'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

permissions:
  contents: write

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: '8192'
        swap-size-mb: '1024'
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Aggressive extra cleanup
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                    "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
        sudo apt-get clean
        docker system prune -af --volumes 2>/dev/null || true

    - name: Checkout Custom WOA Tools
      uses: actions/checkout@v4
      with:
        path: woa-tools

    - name: Build Environment & ZRAM Setup
      run: |
        sudo apt-get update
        sudo apt install aria2 linux-modules-extra-$(uname -r) zram-tools -y
        
        echo "Setting up ZRAM..."
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap || true
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap || true
        sudo systemctl restart zramswap || true
        zramctl
        
        sudo apt autoclean >/dev/null || true

    - name: Initialize TWRP Workspace
      run: |
        TWRP_BRANCH="${{ inputs.TWRP_BRANCH }}"
        TWRP_BRANCH=${TWRP_BRANCH:-android-12.1}
        
        mkdir -p ${GITHUB_WORKSPACE}/TWRP
        cd ${GITHUB_WORKSPACE}/TWRP
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b $TWRP_BRANCH
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree from Input URL
      run: |
        TWRP_BRANCH="${{ inputs.TWRP_BRANCH }}"
        TWRP_BRANCH=${TWRP_BRANCH:-android-12.1}
        DEVICE_TREE="${{ inputs.DEVICE_TREE }}"
        DEVICE_TREE_BRANCH="${{ inputs.DEVICE_TREE_BRANCH }}"
        DEVICE_PATH="${{ inputs.DEVICE_PATH }}"
        
        cd ${GITHUB_WORKSPACE}/TWRP
        echo "Cloning device tree from $DEVICE_TREE (branch: $DEVICE_TREE_BRANCH) into $DEVICE_PATH..."
        git clone "$DEVICE_TREE" -b "$DEVICE_TREE_BRANCH" "./$DEVICE_PATH"
        cd "$DEVICE_PATH"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Inject WOA Formatting Binaries into Recovery Root
      run: |
        TWRP_BRANCH="${{ inputs.TWRP_BRANCH }}"
        TWRP_BRANCH=${TWRP_BRANCH:-android-12.1}
        DEVICE_PATH="${{ inputs.DEVICE_PATH }}"
        
        SBIN_PATH="${GITHUB_WORKSPACE}/TWRP/$DEVICE_PATH/recovery/root/sbin"
        mkdir -p "$SBIN_PATH"

        cp woa-tools/parted "$SBIN_PATH/parted" 2>/dev/null || true
        cp woa-tools/mkfs.fat "$SBIN_PATH/mkfs.fat" 2>/dev/null || true
        cp woa-tools/mkfs.ntfs "$SBIN_PATH/mkfs.ntfs" 2>/dev/null || true
        cp woa-tools/PARTITION "$SBIN_PATH/partition" 2>/dev/null || true
        cp woa-tools/RESTORE "$SBIN_PATH/restore" 2>/dev/null || true

        chmod 755 "$SBIN_PATH/parted" "$SBIN_PATH/mkfs.fat" "$SBIN_PATH/mkfs.ntfs" \
                  "$SBIN_PATH/partition" "$SBIN_PATH/restore" 2>/dev/null || true

    - name: Building TWRP
      run: |
        DEVICE_NAME="${{ inputs.DEVICE_NAME }}"
        BUILD_TARGET="${{ inputs.BUILD_TARGET }}"
        
        cd ${GITHUB_WORKSPACE}/TWRP
        set +e
        export TW_DEFAULT_LANGUAGE=en
        
        export USE_CCACHE=1
        export CCACHE_DIR=$(pwd)/.ccache
        mkdir -p $CCACHE_DIR
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 5G
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        
        lunch omni_${DEVICE_NAME}-eng
        make clean
        mka adbd ${BUILD_TARGET}image

    - name: Set Release Properties
      run: |
        DEVICE_TREE="${{ inputs.DEVICE_TREE }}"
        echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
        DEVICE_TREE_URL="$DEVICE_TREE"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          TWRP/out/target/product/*/recovery.img
          TWRP/out/target/product/*/boot.img
          TWRP/out/target/product/*/*.zip
        name: Modded TWRP WOA - pipa // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}-twrp
        body: |
          ## TWRP Recovery Build - Windows-on-ARM Modded
          Device Tree: [External Repository](${{ env.DEVICE_TREE_URL }})
          Commit: [${{ env.COMMIT_ID }}](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
          
          **Included WOA Flasher Integration:**
          * Embedded `mkfs.ntfs`, `mkfs.fat`, and `parted` binaries inside recovery `sbin`.
          * Active support for executing Windows deployment scripts (`partition`/`restore`).
